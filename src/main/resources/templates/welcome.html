<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>KB STRIDE</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;

        background-image:
            linear-gradient(rgba(0, 0, 0, 0.45),
                            rgba(0, 0, 0, 0.45)),
            url('/images/background1.jpg');

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        color: white;
    }

    /* Header */

    header {
        width: 100%;
        padding: 30px 50px;

        display: flex;
        justify-content: flex-end;
        align-items: center;

        position: absolute;
        top: 0;
        left: 0;
    }

    /* Login / Signup / Track Order */

    .auth-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .auth-buttons a {
        text-decoration: none;
        color: white;

        padding: 12px 25px;

        border: 1px solid white;
        border-radius: 25px;

        font-size: 14px;
        font-weight: bold;

        transition: all 0.3s ease;
    }

    .auth-buttons a:hover {
        background-color: white;
        color: black;
    }

    /* Center Brand */

    .brand-container {
        height: 100vh;

        display: flex;
        flex-direction: column;

        justify-content: center;
        align-items: center;

        text-align: center;
    }

    .brand-name {
        font-size: 80px;
        font-weight: 900;

        letter-spacing: 10px;

        text-shadow:
            2px 2px 10px rgba(0,0,0,0.8);
    }

    .tagline {
        margin-top: 15px;

        font-size: 22px;
        letter-spacing: 8px;

        font-weight: 500;

        text-shadow:
            2px 2px 8px rgba(0,0,0,0.8);
    }

    /* Mobile */

    @media (max-width: 768px) {

        header {
            padding: 20px;
        }

        .brand-name {
            font-size: 45px;
            letter-spacing: 5px;
        }

        .tagline {
            font-size: 14px;
            letter-spacing: 4px;
        }

        .auth-buttons {
            gap: 8px;
        }

        .auth-buttons a {
            padding: 9px 14px;
            font-size: 11px;
        }
    }

</style>
```

</head>

<body>

```
<!-- Login / Signup / Track Order -->

<header>

    <div class="auth-buttons">

        <a href="/track-order">
            TRACK ORDER
        </a>

        <a href="/login">
            LOGIN
        </a>

        <a href="/signup">
            SIGN UP
        </a>

    </div>

</header>


<!-- Brand -->

<main class="brand-container">

    <div class="brand-name">
        KB STRIDE
    </div>

    <div class="tagline">
        OWN EVERY STEP.
    </div>

</main>
```

</body>
</html>
