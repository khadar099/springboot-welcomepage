<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KB STRIDE - Login</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            width: 350px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 30px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .success {
            color: green;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>KB STRIDE</h1>

    <h2>Login</h2>

    <!-- Login error -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Signup success message -->
    <div class="success"
         th:if="${param.signupSuccess}"
         th:text="'Account created successfully. Please login.'">
    </div>

    <form th:action="@{/login}" method="post">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <br>

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>
</html>
